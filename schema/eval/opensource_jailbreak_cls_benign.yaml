    If onsite staff are unwilling to help, unable to help, or if you are still dissatisfied,
    you may want to contact the larger business entity. As the entity responsible
    for the branding of the business, a corporate office may be much more responsive
    to consumer complaints.  Do an internet search on the business and look for their
    corporate contact information. Send an email or a letter to the appropriate person.
    Make sure to be polite and clearly articulate the problem or issue. Call the corporate
    entity and ask for customer service or the customer complaint department. Be polite
    and clearly explain the problem. Say something like “Hello, I was a guest at your
    location in Boston’s Back Bay. I was extremely disappointed with the service and
    cleanliness offered there. I feel taken advantage of.” If you booked the hotel
    through a travel or booking website, you may be able to complain directly to that
    business.  Be prepared to be put on hold for potentially long periods of time
    when contacting booking website customer service. Clearly articulate your complaint.
    Have your transaction number or receipt at hand. Be able to provide evidence,
    such as photographs, police reports, or the names of customer service representatives
    at the hotel. Be aware that hotel or travel booking websites are very often unresponsive
    to customer complaints. This owes to their high volume and slim margins on individual
    transactions. If the booking business is unable to resolve your complaint, your
    last recourse is to post a negative review about the hotel in question on their
    website. Depending on your complaint, you should consider contacting the relevant
    regulatory body. As government agencies that oversee businesses that offer public
    accommodations, they’ll be able to deal with and issue appropriate sanctions.  If
    you’re complaining about a health and sanitation issue, contact the local health
    department. Consider contacting the state or province’s division or department
    of hotels and restaurants. If your complaint is serious enough, the licensing
    agent may take action or launch an investigation into the hotel in question.


