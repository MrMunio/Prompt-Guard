    regime," Lieberman said, adding "the fact is, now is the time for action, not
    just statements."


    Saying he hoped that new sanctions would be successful, Lieberman added that the
    United States should be ready to do more.


    "I hope that the opposition forces may end all of this by ... taking it all over
