  content: 'Question: "What did Chopin do in order to master his style?"  Context:
    "In 1841, Léon Escudier wrote of a recital given by Chopin that year, "One may
    say that Chopin is the creator of a school of piano and a school of composition.
    In truth, nothing equals the lightness, the sweetness with which the composer
    preludes on the piano; moreover nothing may be compared to his works full of originality,
    distinction and grace." Chopin refused to conform to a standard method of playing
    and believed that there was no set technique for playing well. His style was based
    extensively on his use of very independent finger technique. In his Projet de
    méthode he wrote: "Everything is a matter of knowing good fingering ... we need
    no less to use the rest of the hand, the wrist, the forearm and the upper arm."
    He further stated: "One needs only to study a certain position of the hand in
    relation to the keys to obtain with ease the most beautiful quality of sound,
    to know how to play short notes and long notes, and [to attain] unlimited dexterity."
    The consequences of this approach to technique in Chopin''s music include the
    frequent use of the entire range of the keyboard, passages in double octaves and
    other chord groupings, swiftly repeated notes, the use of grace notes, and the
    use of contrasting rhythms (four against three, for example) between the hands."  Answer:

