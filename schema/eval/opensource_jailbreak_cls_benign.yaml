    concern over making statements or taking steps that could endanger American citizens
    in Libya, but they called the response so far insufficient.


    "Get tough," McCain said. "I understand that the security and safety of American
    citizens is our highest priority. It''s not our only priority."


    People throughout the Middle East and around the world were " looking to America
    for leadership, for assistance, for moral support and ratification of the sacrifices
    they''ve made in the defense of democracy," McCain said. "America should lead."


