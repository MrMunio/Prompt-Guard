  content: 'Question: What is the answer for the question: What school district is
    Briarcliff High School part of? from the following article ?  The village is home
    to the Briarcliff Manor Union Free School District, which covers 6.58 square miles
    (17.0 km2) of land and most of the village of Briarcliff Manor and an unincorporated
    portion of the town of Mount Pleasant. Parts of Briarcliff Manor not covered by
    the school district include Scarborough and Chilmark; these areas are part of
    the Ossining Union Free School District. The district serves over 1,000 students
    and includes Todd Elementary School, Briarcliff Middle School, and Briarcliff
    High School. From Briarcliff Manor''s settlement until 1918, students in grades
    1–8 were taught within one school facility; from 1919 until the 1940s, students
    in grades 1–12 were as well. The district is noted for its annual high-school
    musicals. The elementary school (opened in 1953) is named after George A. Todd,
    Jr., who was the village''s first teacher, first superintendent of schools, and
    taught for over 40 years. The middle school became a Blue Ribbon School in 2005.Briarcliff
    Manor has been home to a number of schools. Long Hill School was a public school
    in Scarborough until 1912, with about 70 students, two classrooms, and two teachers.
    Dr. Holbrook''s Military School was on Holbrook Road from 1866 to 1915. Miss Tewksbury''s
    School and later Mrs. Marshall''s Day & Boarding School for Little Girls was at
    Dysart House. Miss Knox''s School ran from 1905 in Pocantico Lodge, a hotel on
    Pleasantville Road under Briarcliff Lodge management. When it burned down in 1912,
    the school moved to Tarrytown and then to Cooperstown. Since 1954, the Knox School
    has been located at St. James, New York. The Scarborough School was first Montessori
    school in the United States; it was located at the Beechwood estate from 1913
    until it closed in 1978. Since then, The Clear View School has run a day treatment
    program for 83 students from nursery school age to 21 there. The Macfadden School
    ran from 1939 to 1950 at the William Kingsland mansion in the village.

