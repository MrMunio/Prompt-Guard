    I was returning from lunch one day with a coworker when we noticed two pickup
    trucks driving erratically. This was on Valley View Blvd in Cerritos which is
    a large roadway divided (by a large, planted median strip) with 3 lanes on either
    side. One truck seemed to be chasing the other when suddenly the lead truck made
    a quick U-turn and was followed by the second truck. But the second truck came
    to stop just after making the turn. This was when the driver of that truck got
    out, walked to the front of his vehicle, raised his arm holding a semi-automatic
    handgun, paused, and then fired a single shot. At this point, I was parallel with
    the shooter’s truck and only about 50–60 feet from where he was standing. I remember
    my coworker exclaiming, “Oh sh*t! Did he just shoot at the something?!” I floored
    my accelerator and sped off to my workplace which was about a 1/2 mile down Valley
    View Blvd. I parked and my coworker and I got into the building as quickly as
    we could. While he started telling our other coworkers about what we had just
    witnessed, I ran to my desk, called 911, and reported the shooting. The dispatcher
    kept me on the line after my initial report and then transferred me to a detective
    in order to take down my information. As it turns out, my information and the
    fact that I called 911 immediately resulted in the arrest of the shooter. I was
    later asked to testify in court which resulted in the shooters conviction. I lived
    in Southern California for 10 years and now I drive a commercial truck several
    days a week so I have PLENTY of other “road rage stories”, but this is still the
    craziest one. According to the above context, choose the correct option to answer
    the following question. Question: How long did it take the driver to get to his
    workplace? Options: - one minute - not enough information - one year - one day'
