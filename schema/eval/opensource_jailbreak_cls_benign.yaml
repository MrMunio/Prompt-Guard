    , but nonetheless many of his works were seized by the authorities as degenerate
    art in 1937 . He died in Berlin in 1939 .  - George Grosz (July 26, 1893  July
    6, 1959) was a German artist known especially for his caricatural drawings and
    paintings of Berlin life in the 1920s. He was a prominent member of the Berlin
    Dada and New Objectivity group during the Weimar Republic. He emigrated to the
    United States in 1933, and became a naturalized citizen in 1938. Abandoning the
    style and subject matter of his earlier work, he exhibited regularly and taught
