  content: 'Information:  - Max Beckmann (February 12, 1884  December 27, 1950) was
    a German painter, draftsman, printmaker, sculptor, and writer. Although he is
    classified as an Expressionist artist, he rejected both the term and the movement.
    In the 1920s, he was associated with the New Objectivity ("Neue Sachlichkeit"),
    an outgrowth of Expressionism that opposed its introverted emotionalism.  - Alexander
    Kanoldt ( 29 September 1881 -- 24 January 1939 ) was a German magic realist painter
    and one of the artists of the New Objectivity . Kanoldt was born in Karlsruhe
    . His father was the painter Edmond Kanoldt , a late practitioner of the Nazarene
    style . After studies at the Academy of Fine Arts Karlsruhe in Karlsruhe he went
    to Munich in 1908 , where he met a number of modernists such as Alexei Jawlensky
    , Wassily Kandinsky and Gabriele Münter . He became a member of the Munich New
    Secession in 1913 , with Jawlensky and Paul Klee . After military service in World
    War I from 1914 to 1918 , the still lifes Kanoldt painted show the influence of
    Derain and an adaptation of cubist ideas . By the early 1920s Kanoldt developed
    the manner for which he is best known , a magic realist rendering of potted plants
