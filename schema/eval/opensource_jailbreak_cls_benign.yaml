    for more than 40 years, clinging to power in Tripoli after weeks of protests.


    On Saturday, President Obama said Gadhafi "has lost the legitimacy to rule and
    needs to do what is right for his country by leaving now." Secretary of State
    Hillary Clinton also issued a statement urging the Libyan leader to step down.


